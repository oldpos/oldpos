*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--r-sm:10px;--r-md:14px;--r-lg:18px;--r-xl:24px;--sk-rgb:37,99,235}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali","Kohinoor Bangla","Nirmala UI",sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
body:before{content:"";position:fixed;inset:0 0 auto 0;height:340px;background:radial-gradient(900px 300px at 85% -10%,color-mix(in srgb,var(--primary) 16%,transparent),transparent 70%);pointer-events:none;z-index:-1}
button,input,textarea{font-family:inherit}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.top .in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.top img{width:36px;height:36px;border-radius:11px;box-shadow:var(--shadow)}
.top b{font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.2}.top b small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0}
.top a.sw{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--ptext);background:var(--psoft);padding:8px 14px;border-radius:99px;text-decoration:none}
.tg{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none}.tg svg{width:18px;height:18px}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 40px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;margin:6px 0 14px;flex-wrap:wrap}
.page-head h2{font-size:21px;font-weight:800;margin:0}.page-head p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.muted{color:var(--muted)}.xs{font-size:12.5px;line-height:1.45}
.label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px}
.field{margin-bottom:14px}
.input{width:100%;font-size:16px;color:var(--text);background:var(--input);border:1.5px solid color-mix(in srgb,var(--muted) 45%,var(--border));border-radius:12px;padding:13px 14px;outline:0;transition:border-color .15s,box-shadow .15s}
.input:hover{border-color:var(--muted)}.input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--ring)}
textarea.input{display:block}
.chip{border:1px solid var(--border);white-space:nowrap;padding:8px 15px;border-radius:99px;font-size:13px;font-weight:700;background:var(--card);color:var(--muted);cursor:pointer}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:14px;min-height:46px;padding:0 18px;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 10px 20px -10px rgba(var(--sk-rgb),.8)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:transparent}.btn-block{display:flex;width:100%}
.btn:active{transform:scale(.99)}
footer{margin-top:30px;color:var(--muted);font-size:12.5px;text-align:center}footer a{color:var(--primary)}
.bz{max-width:none}
/* ---- v12.9.3 standalone page additions ---- */
.bz-hbtn{display:inline-flex;align-items:center;gap:6px;margin-top:16px;padding:11px 18px;border-radius:99px;background:#fff;color:var(--sk-deep,#1e40af);font-weight:800;font-size:14px;text-decoration:none;box-shadow:0 10px 22px -10px rgba(0,0,0,.45)}
.bz-sec{margin-top:26px}
.bz-sh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.bz-sh h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}.bz-sh p{margin:1px 0 0;font-size:12.5px;color:var(--muted)}
.bz-sn{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--grad);color:#fff;font-weight:800;font-size:15px;box-shadow:0 8px 16px -8px rgba(var(--sk-rgb),.8)}
.bz-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:5px;background:var(--hover);border:1px solid var(--border);border-radius:16px}
.bz-tab{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border:1.5px solid transparent;border-radius:12px;background:transparent;color:var(--muted);font-size:14.5px;font-weight:800;cursor:pointer;transition:.18s}
.bz-tab span{font-size:18px}
.bz-tab[aria-pressed=true]{background:var(--card);color:var(--ptext);border-color:color-mix(in srgb,var(--primary) 38%,var(--border));box-shadow:var(--shadow)}
.bz-info{margin-top:10px;padding:12px 15px;border:1px solid color-mix(in srgb,var(--primary) 24%,var(--border));border-left:4px solid var(--primary);border-radius:13px;background:var(--psoft);color:var(--ptext);font-size:13.5px;line-height:1.6}
.bz-rows{display:grid;gap:11px;margin-top:12px}
.bz-row{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;color:var(--text);font:inherit;background:var(--card);border:1.5px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s,transform .12s,box-shadow .18s,opacity .5s,transform .5s}
.bz-row:hover{border-color:color-mix(in srgb,var(--primary) 55%,var(--border));box-shadow:var(--shadow-lg)}
.bz-row:focus-visible{outline:0;box-shadow:0 0 0 4px var(--ring);border-color:var(--primary)}
.bz-row .bz-ic{width:46px;height:46px}
.bz-rn{font-weight:800;font-size:16.5px;line-height:1.25}.bz-rn small{display:block;font-weight:500;font-size:12.5px;color:var(--muted);margin-top:2px}
.bz-rp{margin-left:auto;text-align:right;font-weight:800;font-size:20px;color:var(--primary);white-space:nowrap;font-variant-numeric:tabular-nums}
.bz-rp .bz-go{display:block;width:max-content;margin:5px 0 0 auto;font-size:11.5px;padding:3px 11px;box-shadow:none}
.bz-row .bz-tag{position:absolute;top:-9px;right:16px;font-style:normal;font-size:10.5px;font-weight:800;padding:1px 10px;border-radius:99px;background:var(--warnsoft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.bz-go2{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:#fff;background:var(--grad);padding:8px 14px;border-radius:99px;box-shadow:0 8px 16px -8px rgba(var(--sk-rgb),.8)}
.bz-svc .bz-no{display:none}
.bz-grid{grid-template-columns:1fr}
@media(min-width:760px){.bz-grid{grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch}.bz-svc{grid-template-columns:1fr;grid-template-areas:"ic" "body" "cta"}.bz-svc .bz-body{padding-right:0}.bz-svc .bz-cta{align-self:end}}
/* gradual reveal */
.bz-rv{opacity:0;transform:translateY(16px);transition:opacity .55s cubic-bezier(.22,1,.36,1) var(--d,0ms),transform .55s cubic-bezier(.22,1,.36,1) var(--d,0ms)}
.bz-rv.in{opacity:1;transform:none}
.bz-row.bz-rv.in:active,.bz-svc.bz-rv.in:active{transform:scale(.99)}
@media(prefers-reduced-motion:reduce){.bz-rv{opacity:1;transform:none;transition:none}}
@media(max-width:560px){.wrap{padding:12px 12px 40px}.bz-rp{font-size:17px}.bz-rn{font-size:14.5px}.bz-row{padding:13px 12px;gap:10px}.bz-row .bz-ic{width:40px;height:40px}.bz-tab{font-size:13px;gap:5px;min-height:46px}}

/* Old POS v12.9.3 — Business Support page. Uses the app's own tokens so every skin, light and dark mode just works. */
.bz{max-width:980px;margin:0 auto;padding-bottom:28px;font-family:inherit}
.bz .bz-i{flex:none;display:block}
.bz-head{margin-bottom:14px}
.bz-headl{display:flex;align-items:center;gap:10px;min-width:0}
.bz-back{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.bz-back:hover{background:var(--hover)}

/* hero */
.bz-hero{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:22px 22px 18px;color:#fff;background:var(--grad);box-shadow:var(--shadow-lg)}
.bz-hero:before,.bz-hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.11);pointer-events:none}
.bz-hero:before{width:210px;height:210px;right:-60px;top:-80px}
.bz-hero:after{width:130px;height:130px;right:90px;bottom:-70px;background:rgba(255,255,255,.07)}
.bz-hero-t{position:relative;max-width:620px}
.bz-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.18);font-size:12px;font-weight:700;letter-spacing:.01em}
.bz-hero h1{margin:12px 0 6px;font-size:clamp(21px,4.6vw,30px);line-height:1.25;letter-spacing:-.01em;font-weight:800}
.bz-hero p{margin:0;font-size:14px;line-height:1.6;opacity:.93}
.bz-hero-s{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.bz-hero-s div{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:9px 6px;text-align:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.bz-hero-s b{display:block;font-size:17px;font-weight:800;line-height:1.2}
.bz-hero-s span{display:block;font-size:11.5px;opacity:.9;margin-top:1px}

.bz-h3{font-size:16px;font-weight:800;margin:22px 2px 10px;letter-spacing:-.01em}

/* service cards */
.bz-grid{display:grid;grid-template-columns:1fr;gap:12px}
.bz-svc{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"ic body" "cta cta";gap:12px 14px;align-items:start;width:100%;text-align:left;color:var(--text);font:inherit;background:var(--card);border:1.5px solid var(--border);border-radius:var(--r-lg);padding:16px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s,transform .12s,box-shadow .18s}
.bz-svc:hover{border-color:color-mix(in srgb,var(--primary) 55%,var(--border));box-shadow:var(--shadow-lg)}

.bz-svc:focus-visible{outline:0;border-color:var(--primary);box-shadow:0 0 0 4px var(--ring)}
.bz-no{position:absolute;top:12px;right:14px;font-size:12px;font-weight:800;color:var(--muted);opacity:.7}
.bz-ic{grid-area:ic;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--psoft);color:var(--primary)}

.bz-tag{font-style:normal;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:99px;background:var(--warnsoft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.bz-s{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:1px}
.bz-d{display:block;font-size:13.5px;color:var(--text);opacity:.82;line-height:1.6;margin-top:8px}
.bz-pts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

.bz-cta{grid-area:cta;display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px dashed var(--border);padding-top:12px}

.bz-trust{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}
.bz-trust>div{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:11px 14px;color:var(--ok)}
.bz-trust span{display:block;font-size:12.5px;color:var(--muted);line-height:1.4}
.bz-trust b{display:block;color:var(--text);font-size:13.5px}
@media(min-width:720px){.bz-trust{grid-template-columns:1fr 1fr}}
.bz-note{margin:14px 2px 0;padding:11px 14px;border-radius:12px;background:var(--hover);color:var(--muted);font-size:12.5px;line-height:1.6}
.bz-help{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;padding:13px 16px;border-radius:14px;font-weight:700;font-size:14px;text-decoration:none;color:#15803d;background:color-mix(in srgb,#16a34a 10%,var(--card));border:1px solid color-mix(in srgb,#16a34a 28%,var(--border))}
html.dark .bz-help{color:#4ade80}
.bz-help:hover{background:color-mix(in srgb,#16a34a 16%,var(--card))}

/* history */
.bz-his{display:grid;gap:8px}
.bz-hi{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 14px;font-size:13.5px}
.bz-hi div{min-width:0}
.bz-hi b{display:block;font-weight:800}
.bz-hi span{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bz-hi em{margin-left:auto;font-style:normal;font-weight:800;color:var(--primary);white-space:nowrap}
.bz-hi a{font-size:12px;font-weight:700;color:var(--ok);text-decoration:none;white-space:nowrap}

/* stepper */
.bz-steps{list-style:none;display:flex;gap:6px;margin:0 0 14px;padding:0}
.bz-steps li{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 6px;border-radius:12px;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--hover);border:1px solid transparent}
.bz-steps li span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1.5px solid var(--border);font-size:11.5px;font-weight:800}
.bz-steps li.on{color:var(--ptext);background:var(--psoft);border-color:color-mix(in srgb,var(--primary) 35%,var(--border))}
.bz-steps li.on span{background:var(--primary);border-color:var(--primary);color:#fff}
.bz-steps li.done{color:var(--ok)}
.bz-steps li.done span{background:var(--ok);border-color:var(--ok);color:#fff}

/* forms */
.bz-card{padding:18px;max-width:640px}
.bz .field{margin-bottom:16px}
.bz-sum{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--psoft);color:var(--ptext);border-radius:14px;padding:13px 15px;margin-bottom:18px;font-weight:700;font-size:14px}
.bz-sum em{font-style:normal;font-size:20px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.bz-hint{margin-top:6px}
.bz-err{min-height:1.2em;margin:4px 2px 0;color:var(--bad);font-size:13px;font-weight:600}
.bz .input.bad{border-color:var(--bad)!important}
.bz-btn{margin-top:8px;min-height:50px;font-size:15.5px;font-weight:800;gap:8px}
.bz-ta{resize:vertical;min-height:84px;line-height:1.5;font-family:inherit}
.bz-usdwrap{position:relative}
.bz-usdwrap span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:800;color:var(--muted);pointer-events:none}
.bz-usdwrap .input{padding-left:30px;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.bz-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.bz-calc{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:11px 14px;border-radius:12px;background:var(--hover);color:var(--muted);font-size:13.5px;font-weight:600}
.bz-calc b{font-size:19px;color:var(--text);font-weight:800}
.bz-calc.ok{background:var(--oksoft);color:var(--ok)}
.bz-calc.ok b{color:var(--ok)}
.bz-calc.bad{background:var(--badsoft);color:var(--bad)}
.bz-warn{margin-top:10px;padding:10px 13px;border-radius:12px;background:var(--warnsoft);color:var(--warn);font-size:12.5px;line-height:1.55;font-weight:600}
.bz-incl{margin-bottom:16px;padding:14px 15px;border-radius:14px;background:var(--hover);border:1px solid var(--border)}
.bz-incl b{display:block;font-size:13.5px;margin-bottom:8px}
.bz-incl ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.bz-incl li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);opacity:.88}
.bz-incl .bz-i{color:var(--ok)}

/* packages */
.bz-pk{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:9px}
.bz-p{display:flex;flex-direction:column;align-items:center;gap:2px;padding:13px 6px;border-radius:15px;border:2px solid var(--border);background:var(--card);color:var(--text);font:inherit;cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
.bz-p b{font-size:17px;font-weight:800}
.bz-p span{font-size:11.5px;color:var(--muted);font-weight:600}
.bz-p em{font-style:normal;margin-top:6px;font-weight:800;font-size:14.5px;color:var(--primary);font-variant-numeric:tabular-nums}
.bz-p:hover{border-color:color-mix(in srgb,var(--primary) 50%,var(--border))}
.bz-p.sel{border-color:var(--primary);background:var(--psoft);box-shadow:0 0 0 3px var(--ring)}
.bz-p:focus-visible{outline:0;box-shadow:0 0 0 3px var(--ring)}

/* payment */
.bz-m{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.bz-m button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:104px;padding:12px 4px;border-radius:15px;border:2px solid var(--border);background:var(--card);color:var(--text);font:inherit;cursor:pointer;box-shadow:var(--shadow);transition:.15s}
.bz-m button b{font-size:13.5px}
.bz-m button small{font-size:10.5px;color:var(--muted);font-weight:500;line-height:1.25}
.bz-m button[aria-pressed=true]{border-color:var(--primary);background:var(--psoft);color:var(--ptext);box-shadow:0 0 0 3px var(--ring)}
.bz-mark{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:#fff;font-size:13px;font-weight:800;letter-spacing:-.6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.bz-mark.bk{background:#e2136e}.bz-mark.ng{background:linear-gradient(135deg,#f7941d,#ed1c24)}.bz-mark.rk{background:#8c3494}
.bz-num{display:flex;align-items:center;gap:10px;margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--psoft);border:1px solid color-mix(in srgb,var(--primary) 38%,var(--border))}
.bz-num div{flex:1;min-width:0}
.bz-num small{display:block;font-size:12px;color:var(--muted)}
.bz-num b{font-size:clamp(18px,4.4vw,23px);letter-spacing:.4px;font-variant-numeric:tabular-nums}
.bz-num button{border:0;border-radius:10px;padding:9px 15px;background:var(--primary);color:#fff;font-weight:700;font-size:13px;cursor:pointer}
.bz-amt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 0;padding:11px 14px;border-radius:12px;background:var(--warnsoft);color:var(--warn);font-size:13.5px;font-weight:700;border:1px solid color-mix(in srgb,var(--warn) 22%,var(--border))}
.bz-amt b{font-size:18px;color:var(--text)}
.bz-how{margin:14px 0 16px;padding:0;list-style:none;counter-reset:s}
.bz-how li{counter-increment:s;position:relative;padding:5px 0 5px 32px;color:var(--muted);font-size:13.5px;line-height:1.55}
.bz-how li:before{content:counter(s);position:absolute;left:0;top:5px;width:22px;height:22px;border-radius:50%;background:var(--psoft);color:var(--ptext);font-weight:800;font-size:12px;display:grid;place-items:center}
.bz-how b{color:var(--text)}

/* done */
.bz-ok{text-align:center;margin:0 auto}
.bz-tick{width:68px;height:68px;margin:2px auto 12px;border-radius:50%;display:grid;place-items:center;background:var(--oksoft);color:var(--ok)}
.bz-oid{display:inline-block;font-size:21px;font-weight:800;letter-spacing:1.5px;color:var(--primary);background:var(--psoft);padding:7px 18px;border-radius:12px}
.bz-link{display:block;margin:6px auto 0;background:none;border:0;color:var(--primary);font-weight:700;font-size:12.5px;cursor:pointer}
.bz-osum{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 0 4px;padding:12px 14px;border-radius:13px;background:var(--hover);font-size:13.5px;text-align:left}
.bz-osum span{font-weight:800;color:var(--primary);white-space:nowrap}
.bz-tl{list-style:none;margin:14px 0;padding:0;text-align:left}
.bz-tl li{position:relative;padding:0 0 14px 34px;font-size:13px;color:var(--muted);line-height:1.5}
.bz-tl li:before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--border)}
.bz-tl li:last-child:before{display:none}
.bz-tl li:after{content:"";position:absolute;left:3px;top:2px;width:16px;height:16px;border-radius:50%;border:2px solid var(--border);background:var(--card)}
.bz-tl li.d:after{background:var(--ok);border-color:var(--ok)}
.bz-tl li.n:after{border-color:var(--primary)}
.bz-tl b{display:block;color:var(--text);font-size:13.5px}
.bz-wa{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;margin:2px 0 10px;border-radius:14px;background:#16a34a;color:#fff!important;font-weight:800;font-size:15px;text-decoration:none;border:0;box-shadow:0 10px 20px -10px rgba(22,163,74,.7)}
.bz-wa:hover{background:#15803d}

@media(max-width:560px){
  .bz-hero{padding:18px 16px 14px;border-radius:20px}
  .bz-card{padding:14px}
  .bz-pk{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bz-steps li{font-size:12px;gap:5px;padding:8px 4px}
  .bz-svc{padding:14px 13px;gap:10px 12px}
  .bz-ic{width:46px;height:46px;border-radius:14px}
  .bz-t{font-size:15.5px}
}

/* ======== v12.9.3 advanced page ======== */
.bz-hero{padding:30px 22px 20px;border-radius:28px}

/* follower package cards */

<script>
/* Old POS Business Support (v12.9.3) — standalone page oldpos.com/business (replaces the old /smm page).
   Followers first, then Facebook Ads · Business Page setup · Faceless promo video.
   Flow: service -> details -> payment (bKash / Nagad / Rocket) -> order sent to WhatsApp. */
(function () {
  'use strict';
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = id => document.getElementById(id);

  /* ====== Config (change prices / numbers here) ====== */
  const WA = '8801350323319';
  const USD_RATE = 155;          // ৳ per 1 USD of Facebook Ads budget
  const USD_MIN = 10;            // minimum ad budget in USD
  const USD_MAX = 10000;
  const PM = {
    bKash:  { n: '01350-323319', c: '#e2136e', bn: 'বিকাশ', mark: 'bK', cls: 'bk' },
    Nagad:  { n: '01627-647776', c: '#f6921e', bn: 'নগদ',  mark: 'N',  cls: 'ng' },
    Rocket: { n: '01350-323319', c: '#8c3494', bn: 'রকেট', mark: 'R',  cls: 'rk' }
  };
  const PKG = {
    world: [[5000, '৫ হাজার', 395], [10000, '১০ হাজার', 790], [25000, '২৫ হাজার', 1975], [50000, '৫০ হাজার', 3950], [100000, '১ লক্ষ', 7900]],
    bd:    [[5000, '৫ হাজার', 900], [10000, '১০ হাজার', 1700], [30000, '৩০ হাজার', 5100], [50000, '৫০ হাজার', 8500]]
  };
  const SETUP_PRICE = 1500, VIDEO_PRICE = 2000;
  const ADS_CHIPS = [10, 20, 50, 100, 250];

  /* ====== Icons (24px outline, currentColor) ====== */
  const IC = {
    ads: '<path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>',
    world: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
    bd: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>',
    setup: '<path d="M3 9 4.5 4h15L21 9"/><path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/><path d="M5 12v8h14v-8"/><path d="M10 20v-5h4v5"/>',
    video: '<circle cx="12" cy="12" r="9"/><path d="m10 8.5 6 3.5-6 3.5z"/>',
    check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
    back: '<path d="M15 18l-6-6 6-6"/>',
    wa: '<path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/>',
    shield: '<path d="M12 3 4 6v6c0 4.5 3.2 7.7 8 9 4.8-1.3 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
    arrow: '<path d="M9 18l6-6-6-6"/>'
  };
  const svg = (n, s) => `<svg class="bz-i" viewBox="0 0 24 24" width="${s || 22}" height="${s || 22}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

  /* ====== Helpers ====== */
  const BNd = '০১২৩৪৫৬৭৮৯';
  const bn = n => String(n).replace(/\d/g, d => BNd[d]);
  const tk = n => bn(Number(n).toLocaleString('en-US')) + '৳';
  const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (_) { return null; } };
  const jget = k => { try { return JSON.parse(ls(k) || '[]') || []; } catch (_) { return []; } };
  function cleanLink(v) {
    v = (v || '').trim();
    if (v && !/^[a-z][a-z0-9+.-]*:/i.test(v) && /^[\w-]+(\.[\w-]+)+/i.test(v)) v = 'https://' + v;
    try { const u = new URL(v); if (u.protocol !== 'https:' && u.protocol !== 'http:') return null; if (u.hostname.indexOf('.') < 1 || /\s/.test(v)) return null; return u.href.slice(0, 300); } catch (_) { return null; }
  }
  function isFb(l) { try { const h = new URL(l).hostname.toLowerCase(); return h === 'facebook.com' || h.endsWith('.facebook.com') || h === 'fb.com' || h.endsWith('.fb.com') || h === 'fb.me'; } catch (_) { return false; } }
  function copyText(t, done) {
    const ok = () => done && done();
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, ok);
    else { const i = document.createElement('input'); i.value = t; i.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(i); i.select(); try { document.execCommand('copy'); } catch (_) {} i.remove(); ok(); }
  }

  /* ====== Services — the order here is the order shown on the page ====== */
  const SERVICES = [
    { key: 'ads', icon: 'ads', title: 'Facebook অ্যাড রান', sub: 'আপনার পেইজ বুস্ট করুন',
      desc: 'আপনার Facebook পেইজের লিংক দিন, বাজেট বেছে নিন — আমরা আপনার পেইজের জন্য বিজ্ঞাপন চালানোর কাজ করে দেব।',
      pts: ['সর্বনিম্ন $১০ থেকে শুরু', 'বাজেটের কোনো সর্বোচ্চ সীমা নেই', 'প্রতি ডলার ' + tk(USD_RATE)],
      price: 'শুরু ' + tk(USD_MIN * USD_RATE), tag: 'জনপ্রিয়' },
    { key: 'world', icon: 'world', title: 'ওয়ার্ল্ড ফলোয়ার', sub: 'Worldwide Facebook Followers',
      desc: 'Facebook Page / Profile-এর জন্য ওয়ার্ল্ডওয়াইড ফলোয়ার প্যাকেজ। প্যাকেজ বেছে লিংক দিন।',
      pts: ['৫ হাজার থেকে ১ লক্ষ প্যাকেজ', 'পাসওয়ার্ড লাগবে না'],
      price: 'শুরু ' + tk(PKG.world[0][2]) },
    { key: 'bd', icon: 'bd', title: 'বাংলাদেশি ফলোয়ার', sub: 'Bangladeshi Facebook Followers',
      desc: 'বাংলাদেশি অডিয়েন্সের জন্য ফলোয়ার প্যাকেজ। সম্পন্ন হতে তুলনামূলক বেশি সময় লাগতে পারে।',
      pts: ['৫ হাজার থেকে ৫০ হাজার প্যাকেজ', 'পাসওয়ার্ড লাগবে না'],
      price: 'শুরু ' + tk(PKG.bd[0][2]) },
    { key: 'setup', icon: 'setup', title: 'বিজনেস পেইজ সেটআপ', sub: 'প্রফেশনাল পেইজ তৈরি',
      desc: 'ব্যবসার জন্য প্রয়োজনীয় সবকিছু সাজিয়ে দেওয়া হবে — লোগো, প্রোফাইল ও আনুষঙ্গিক সবকিছু।',
      pts: ['লোগো ও প্রোফাইল ছবি', 'কভার ও ব্যবসার তথ্য', 'প্রয়োজনীয় সব সেটআপ'],
      price: tk(SETUP_PRICE) },
    { key: 'video', icon: 'video', title: 'প্রমোশনাল ভিডিও', sub: 'ফেইসলেস (মুখ দেখানো ছাড়া)',
      desc: 'আপনার ব্যবসার জন্য ফেইসলেস প্রমোশনাল ভিডিও — যেখানে কাউকে ক্যামেরার সামনে আসতে হবে না।',
      pts: ['ভিডিও ১ মিনিটের বেশি হবে', 'ব্যবসার প্রচারের জন্য উপযোগী'],
      price: tk(VIDEO_PRICE) }
  ];
  const byKey = k => SERVICES.find(s => s.key === k);

  /* ====== State ====== */
  const S = { market: 'world', step: 1, svc: null, pkg: null, usd: '', link: '', name: '', note: '', m: 'bKash', sn: '', tx: '', done: null, err: '' };
  function reset(keepForm) {
    S.step = 1; S.svc = null; S.pkg = null; S.usd = ''; S.tx = ''; S.done = null; S.err = '';
    if (!keepForm) { S.name = ''; S.note = ''; }
  }

  function total() {
    const s = S.svc;
    if (s === 'ads') { const u = Math.floor(Number(S.usd)); return u >= USD_MIN ? u * USD_RATE : 0; }
    if (s === 'world' || s === 'bd') return S.pkg ? S.pkg[2] : 0;
    if (s === 'setup') return SETUP_PRICE;
    if (s === 'video') return VIDEO_PRICE;
    return 0;
  }
  function summaryTitle() {
    const sv = byKey(S.svc); if (!sv) return '';
    if (S.svc === 'ads') { const u = Math.floor(Number(S.usd)); return sv.title + (u >= USD_MIN ? ' · $' + bn(u) : ''); }
    if (S.svc === 'world' || S.svc === 'bd') return sv.title + (S.pkg ? ' · ' + S.pkg[1] : '');
    return sv.title;
  }
  function detailLines() {
    const L = [];
    if (S.svc === 'ads') { const u = Math.floor(Number(S.usd)); L.push('বাজেট: $' + u + ' (রেট ' + USD_RATE + '৳/ডলার)'); if (S.link) L.push('পেইজ লিংক: ' + S.link); }
    else if (S.svc === 'world' || S.svc === 'bd') { L.push('প্যাকেজ: ' + S.pkg[1] + ' ফলোয়ার (' + S.pkg[0] + ')'); L.push('লিংক: ' + S.link); }
    else { L.push('ব্যবসার নাম: ' + S.name); if (S.link) L.push('বর্তমান পেইজ লিংক: ' + S.link); if (S.note) L.push('নোট: ' + S.note); }
    return L;
  }

  /* ====== Views ====== */
  function head(title, sub, withBack) {
    return `<div class="page-head bz-head"><div class="bz-headl">${withBack ? `<button type="button" class="bz-back" onclick="Business.back()" aria-label="পেছনে">${svg('back', 20)}</button>` : ''}<div><h2>${title}</h2><p>${sub}</p></div></div></div>`;
  }
  function stepper() {
    const labels = ['সার্ভিস', 'তথ্য', 'পেমেন্ট'];
    return `<ol class="bz-steps" aria-label="ধাপ">${labels.map((l, i) => { const n = i + 1, cls = S.step > n ? 'done' : (S.step === n ? 'on' : ''); return `<li class="${cls}"><span>${S.step > n ? svg('check', 14) : bn(n)}</span>${l}</li>`; }).join('')}</ol>`;
  }

  const FAQ = [
    ['ফলোয়ার নিতে কি পেইজের পাসওয়ার্ড দিতে হবে?', 'না। শুধু আপনার পাবলিক Facebook Page বা Profile-এর লিংক দিন। পাসওয়ার্ড, OTP বা লগইন কোড কখনো কাউকে দেবেন না।'],
    ['বাংলাদেশি ও ওয়ার্ল্ড ফলোয়ারের পার্থক্য কী?', 'দুই ধরনের প্যাকেজের মূল্য আলাদা। বাংলাদেশি ফলোয়ার সম্পন্ন হতে তুলনামূলক বেশি সময় লাগতে পারে — অপেক্ষা করতে পারলে অর্ডার করুন।'],
    ['Facebook অ্যাডের বাজেট কীভাবে হিসাব হয়?', 'সর্বনিম্ন $১০ থেকে শুরু, এরপর যত ইচ্ছা বাড়াতে পারবেন। প্রতি ডলারের রেট ' + tk(USD_RATE) + ' — যেমন $২৫ হলে ' + tk(25 * USD_RATE) + '।'],
    ['পেমেন্ট কীভাবে করব ও যাচাই হয় কীভাবে?', 'বিকাশ, নগদ বা রকেটে Send Money করে আপনার নম্বর ও TrxID দিন। WhatsApp-এ পাঠানো তথ্য ম্যানুয়ালি মিলিয়ে দেখার পর অর্ডার প্রসেস শুরু হয়।'],
    ['বিজনেস পেইজ সেটআপে কী কী করে দেওয়া হয়?', 'পেইজ সাজানো ও প্রয়োজনীয় সব সেটআপ, প্রোফাইলে লোগো, কভার ও ব্যবসার তথ্য — আনুষঙ্গিক যা যা লাগে সবকিছু। ফি ' + tk(SETUP_PRICE) + '।'],
    ['প্রমোশনাল ভিডিও কেমন হবে?', 'ফেইসলেস (কারো মুখ দেখানো ছাড়া) ভিডিও, দৈর্ঘ্য ১ মিনিটের বেশি। ফি ' + tk(VIDEO_PRICE) + '। আপনার ব্যবসার নাম ও তথ্য অনুযায়ী তৈরি হয়।'],
    ['ফলাফলের নিশ্চয়তা আছে কি?', 'ফলোয়ার সংখ্যা বা অ্যাডের বাজেট রিচ, বিক্রি বা গ্রাহকের আস্থার নিশ্চয়তা দেয় না। ভালো কনটেন্ট ও নিয়মিত পেইজ পরিচালনাও জরুরি।']
  ];
  function viewList() {
    const hs = jget('biz_orders');
    const M = { world: { t: 'ওয়ার্ল্ড ফলোয়ার', f: '🌍', n: '<b>Worldwide Facebook Followers</b>নির্ধারিত মূল্য প্রযোজ্য। অর্ডারের আগে প্যাকেজ ও লিংক ভালোভাবে যাচাই করে নিন।' },
                bd: { t: 'বাংলাদেশি ফলোয়ার', f: '🇧🇩', n: '<b>বাংলাদেশি Facebook Followers</b>এই সার্ভিস সম্পন্ন হতে তুলনামূলক বেশি সময় লাগতে পারে। ধৈর্য ধরে অপেক্ষা করতে পারলে অর্ডার করুন।' } };
    const list = PKG[S.market];
    const minRate = Math.min.apply(null, list.map(p => p[2] / (p[0] / 1000)));
    const cards = list.map((p, i) => {
      const rate = p[2] / (p[0] / 1000), best = S.market === 'bd' && i > 0 && rate === minRate && rate < list[0][2] / (list[0][0] / 1000);
      const tag = i === 1 ? '<em class="bz-tag">জনপ্রিয়</em>' : (best && i === 2 ? '<em class="bz-tag g">সাশ্রয়ী</em>' : '');
      return `<button type="button" class="bz-pc bz-rv${i === 1 ? ' pop' : ''}" style="--d:${i * 70}ms" onclick="Business.buy('${S.market}',${i})">${tag}
        <span class="bz-pc-ic">${svg(S.market === 'bd' ? 'bd' : 'world', 22)}</span>
        <span class="bz-pc-n">${p[1]}</span><span class="bz-pc-l">ফলোয়ার</span>
        <span class="bz-pc-p">${tk(p[2])}</span>
        <span class="bz-pc-r">প্রতি ১,০০০ ফলোয়ার ≈ ${tk(Math.round(rate))}</span>
        <span class="bz-pc-b">অর্ডার করুন ${svg('arrow', 15)}</span></button>`;
    }).join('');
    const incl = (arr) => `<ul class="bz-ul">${arr.map(x => `<li>${svg('check', 14)}${x}</li>`).join('')}</ul>`;
    const his = hs.length ? `<section class="bz-sec" id="bz-ord"><div class="bz-sh bz-rv"><span class="bz-sn">${svg('check', 18)}</span><div><h3>আপনার আগের অর্ডার</h3><p>এই ডিভাইসে সংরক্ষিত</p></div></div><div class="bz-his bz-rv">${hs.slice(0, 4).map(o => `<div class="bz-hi"><div><b>${esc(o.id)}</b><span>${esc(o.title)} · ${bn(new Date(o.t).getDate())}/${bn(new Date(o.t).getMonth() + 1)}</span></div><em>${tk(Number(o.tk) || 0)}</em><a href="${waUrl(o)}" target="_blank" rel="noopener">আবার পাঠান</a></div>`).join('')}</div></section>` : '';
    return `
      <section class="bz-hero">

        <button type="button" class="bz-link" id="bz-cpid" onclick="Business.copyId()">অর্ডার আইডি কপি করুন</button>
        <div class="bz-osum"><b>${esc(o.title)}</b><span>${tk(o.tk)}</span></div>
        <ul class="bz-tl"><li class="d"><b>অর্ডারের তথ্য তৈরি হয়েছে</b>অর্ডার আইডি আপনার ডিভাইসে সংরক্ষিত</li><li class="n"><b>WhatsApp-এ মেসেজ Send করুন</b>Send না চাপলে অর্ডার আমাদের কাছে পৌঁছাবে না</li><li><b>পেমেন্ট যাচাই</b>ট্রানজেকশন আইডি ও নম্বর ম্যানুয়ালি মিলিয়ে দেখা হবে</li><li><b>অর্ডার প্রসেস</b>যাচাই সম্পন্ন হলে কাজ শুরু হবে</li></ul>
        <a class="btn bz-wa" href="${waUrl(o)}" target="_blank" rel="noopener">${svg('wa', 18)} WhatsApp খুলুন ও অর্ডার Send করুন</a>
        <button type="button" class="btn btn-ghost btn-block" onclick="Business.again()">নতুন অর্ডার</button>
      </div>`;
  }

  const HN = ['', '', 'details', 'pay', 'done'];
  function reveal() {
    const els = document.querySelectorAll('.bz-rv:not(.in)');
    if (!('IntersectionObserver' in window) || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) { els.forEach(e => e.classList.add('in')); return; }
    const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } }), { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
    els.forEach(e => io.observe(e));
  }
  function draw(push) {
    const v = $('view'); if (!v) return;
    let html;
    if (S.step === 1) html = viewList();
    else if (S.step === 2) html = viewDetails();
    else if (S.step === 3) html = viewPay();
    else html = viewDone();
    v.innerHTML = '<div class="bz">' + html + '</div>';
    if (push) { try { history.pushState({ n: S.step }, '', S.step === 1 ? location.pathname + location.search : '#' + HN[S.step]); } catch (_) {} }
    window.scrollTo(0, 0);
    if (S.step === 2) calc();
    if (S.step === 1) { Business.adsCalc($('bz-adn') ? $('bz-adn').value : 25, 'x'); spy(); }
    reveal();
  }
  let spyIO = null;
  function spy() {
    if (spyIO) { spyIO.disconnect(); spyIO = null; }
    if (!('IntersectionObserver' in window)) return;
    const ids = ['bz-fol', 'bz-ads', 'bz-more', 'bz-how', 'bz-faq'];
    spyIO = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) document.querySelectorAll('.bz-nav a').forEach(a => { const on = a.dataset.t === en.target.id; a.classList.toggle('on', on); if (on) { const p = a.parentNode; try { p.scrollTo({ left: a.offsetLeft - 16, behavior: 'smooth' }); } catch (_) {} } }); }), { rootMargin: '-35% 0px -60% 0px' });
    ids.forEach(i => { const e = $(i); if (e) spyIO.observe(e); });
  }
  function go(n) { S.step = n; S.err = ''; if (n === 1) { S.svc = null; S.pkg = null; } draw(true); }

  function calc() {
    const el = $('bz-calc'); if (!el) return;
    const u = Math.floor(Number(S.usd));
    if (!S.usd) { el.className = 'bz-calc'; el.innerHTML = `<span>রেট: প্রতি $১ = <b>${tk(USD_RATE)}</b></span>`; return; }
    if (!(u >= USD_MIN)) { el.className = 'bz-calc bad'; el.innerHTML = `<span>সর্বনিম্ন বাজেট $${bn(USD_MIN)}</span>`; return; }
    el.className = 'bz-calc ok'; el.innerHTML = `<span>$${bn(u)} × ${bn(USD_RATE)} =</span><b>${tk(u * USD_RATE)}</b>`;
  }
  function refreshSum() { const a = $('bz-sa'), t = $('bz-st'), z = $('bz-atot'); if (z) z.textContent = total() ? tk(total()) : '—'; if (a) a.textContent = total() ? tk(total()) : '—'; if (t) t.textContent = summaryTitle(); }

  function waUrl(o) {
    const m = '*নতুন Business Support অর্ডার* (' + o.id + ')\nসার্ভিস: ' + o.title + '\n' + o.lines.join('\n') + '\nটাকা: ' + o.tk + '৳\nপেমেন্ট মাধ্যম: ' + o.m + '\nযে নম্বর থেকে পেমেন্ট: ' + o.sn + '\nTrxID: ' + o.tx;
    return 'https://wa.me/' + WA + '?text=' + encodeURIComponent(m);
  }
  function fail(msg, id) { S.err = msg; const e = $('bz-e'); if (e) e.textContent = msg; const i = id && $(id); if (i) { i.classList.add('bad'); i.focus(); } return false; }

  /* ====== Public API ====== */
  const Business = window.Business = {
    market(k) { S.market = k; const keep = window.scrollY; draw(false); window.scrollTo(0, keep); document.querySelectorAll('.bz-rv').forEach(e => e.classList.add('in')); },
    scrollTo(id) { const e = $(id); if (e) { const y = e.getBoundingClientRect().top + window.scrollY - 118; window.scrollTo({ top: y, behavior: 'smooth' }); } return false; },
    adsCalc(v, from) {
      let u = Math.floor(Number(v)); const out = $('bz-adtot'); if (!out) return;
      if (from !== 'x' || true) { S.usd = v === '' ? '' : String(v); }
      const n = $('bz-adn'), r = $('bz-adr');
      if (from !== 'n' && n && from !== 'x') n.value = v;
      if (from !== 'r' && r && u >= USD_MIN) r.value = Math.min(500, u);
      document.querySelectorAll('.bz-adr .chip, .bz-adbox .chip').forEach(c => c.classList.toggle('on', Number(c.dataset.v) === u));
      if (!(u >= USD_MIN)) { out.className = 'bz-adtot bad'; out.innerHTML = '<span>সর্বনিম্ন বাজেট $' + bn(USD_MIN) + '</span>'; return; }
      out.className = 'bz-adtot ok'; out.innerHTML = '<span>$' + bn(u) + ' × ' + bn(USD_RATE) + '৳</span><b>' + tk(u * USD_RATE) + '</b>';
    },
    adsGo() { const u = Math.floor(Number($('bz-adn') ? $('bz-adn').value : S.usd)); if (!(u >= USD_MIN) || u > USD_MAX) { Business.adsCalc($('bz-adn').value, 'n'); const n = $('bz-adn'); if (n) n.focus(); return; } Business.pick('ads', String(u)); },
    buy(m, i) { reset(true); S.svc = m; S.pkg = PKG[m][i]; S.link = ls('biz_link') || S.link || ''; S.sn = ls('biz_sn') || S.sn || ''; go(2); },
    pick(k, usd) { reset(true); S.usd = usd || ''; S.svc = k; S.link = ls('biz_link') || S.link || ''; S.sn = ls('biz_sn') || S.sn || ''; go(2); },
    set(k, v) { S[k] = v; S.err = ''; const e = $('bz-e'); if (e) e.textContent = ''; document.querySelectorAll('.input.bad').forEach(x => x.classList.remove('bad'));
      if (k === 'usd') { calc(); refreshSum(); document.querySelectorAll('.bz-chips .chip').forEach(c => c.classList.toggle('on', Number(c.dataset.v) === Number(v))); } },
    usd(v) { S.usd = String(v); const i = $('bz-usd'); if (i) i.value = v; Business.set('usd', String(v)); },
    pkg(i) { S.pkg = PKG[S.svc][i]; S.err = ''; const e = $('bz-e'); if (e) e.textContent = ''; document.querySelectorAll('.bz-p').forEach(b => b.classList.toggle('sel', +b.dataset.i === i)); refreshSum(); },
    toPay() {
      S.err = '';
      if (S.svc === 'ads') {
        const l = cleanLink(S.link); if (!l || !isFb(l)) return fail('সঠিক Facebook পেইজের লিংক দিন (যেমন: https://facebook.com/yourpage)', 'bz-link');
        const u = Number(S.usd); if (!(u >= USD_MIN) || u > USD_MAX) return fail('বাজেট সর্বনিম্ন $' + bn(USD_MIN) + ' হতে হবে', 'bz-usd');
        if (u !== Math.floor(u)) return fail('বাজেট পূর্ণ সংখ্যায় দিন (যেমন: ১০, ২৫, ৫০)', 'bz-usd');
        S.link = l;
      } else if (S.svc === 'world' || S.svc === 'bd') {
        if (!S.pkg) return fail('একটি প্যাকেজ বেছে নিন');
        const l = cleanLink(S.link); if (!l || !isFb(l)) return fail('সঠিক Facebook Page / Profile লিংক দিন (যেমন: https://facebook.com/yourpage)', 'bz-link');
        S.link = l;
      } else {
        if (S.name.trim().length < 2) return fail('ব্যবসার নাম লিখুন', 'bz-name');
        if (S.link.trim()) { const l = cleanLink(S.link); if (!l) return fail('লিংকটি সঠিক নয়। ফাঁকা রাখতে পারেন বা সঠিক লিংক দিন', 'bz-link'); S.link = l; }
      }
      if (S.link) ls('biz_link', S.link);
      go(3);
      setTimeout(() => { const i = $('bz-sn'); if (i && !i.value) i.focus({ preventScroll: true }); }, 60);
    },
    method(k) { S.m = k; document.querySelectorAll('#bz-m button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === k)); const n = $('bz-pn'); if (n) { n.textContent = PM[k].n; n.style.color = PM[k].c; } },
    copyNum() { const b = $('bz-cp'); copyText(PM[S.m].n.replace(/-/g, ''), () => { if (b) { b.textContent = 'কপি হয়েছে ✓'; setTimeout(() => { b.textContent = 'কপি'; }, 1600); } }); },
    copyId() { const b = $('bz-cpid'); copyText(S.done.id, () => { if (b) { b.textContent = 'কপি হয়েছে ✓'; setTimeout(() => { b.textContent = 'অর্ডার আইডি কপি করুন'; }, 1600); } }); },
    submit() {
      const sn = String(S.sn).replace(/[\s-]/g, '').replace(/^(\+?88)/, ''), tx = String(S.tx).trim().toUpperCase().replace(/\s/g, '');
      if (!/^01[3-9]\d{8}$/.test(sn)) return fail('সঠিক মোবাইল নম্বর দিন (যে নম্বর থেকে টাকা পাঠিয়েছেন)', 'bz-sn');
      if (!/^[A-Z0-9]{6,20}$/.test(tx)) return fail('সঠিক ট্রানজেকশন আইডি দিন (শুধু ইংরেজি অক্ষর ও সংখ্যা)', 'bz-tx');
      const hs = jget('biz_orders');
      if (hs.some(o => o.tx === tx)) return fail('এই ট্রানজেকশন আইডি দিয়ে আগেই অর্ডার করা হয়েছে', 'bz-tx');
      if (S.busy) return; S.busy = 1;
      const o = { id: 'BIZ' + Date.now().toString(36).toUpperCase().slice(-6), svc: S.svc, title: summaryTitle(), lines: detailLines(), tk: total(), m: S.m, sn, tx, t: Date.now() };
      ls('biz_sn', sn); hs.unshift(o); ls('biz_orders', JSON.stringify(hs.slice(0, 10)));
      S.done = o; S.busy = 0; go(4);
      try { window.open(waUrl(o), '_blank', 'noopener'); } catch (_) {}
    },
    again() { reset(false); go(1); },
    /* arrow / browser Back */
    back() {
      if (S.step > 1 && history.state && history.state.n > 1) { history.back(); return true; }
      if (S.step > 1) { go(S.step === 4 ? 1 : S.step - 1); return true; }
      return false;
    },
    init() {
      try { history.replaceState({ n: 1 }, ''); } catch (_) {}
      window.addEventListener('popstate', e => {
        let n = (e.state && e.state.n) || 1;
        if (n === 4 && !S.done) n = 1;
        if (n > 1 && !S.svc) n = 1;
        S.step = n; if (n === 1) { S.svc = null; S.pkg = null; } draw(false);
      });
      /* direct links from ads: /business/?market=bd&pkg=10000  or  ?service=ads|setup|video */
      const q = new URLSearchParams(location.search), mk = q.get('market'), pk = q.get('pkg') || q.get('p'), sv = q.get('service');
      if (mk === 'bd' || mk === 'worldwide' || mk === 'world') S.market = mk === 'bd' ? 'bd' : 'world';
      draw(false);
      if (sv && ['ads', 'setup', 'video'].indexOf(sv) > -1) { Business.pick(sv); try { history.replaceState({ n: 2 }, '', '#details'); } catch (_) {} }
      else if (pk) { const i = PKG[S.market].findIndex(p => String(p[0]) === pk); if (i > -1) { Business.buy(S.market, i); try { history.replaceState({ n: 2 }, '', '#details'); } catch (_) {} } }
    }
  };
})();

(function(){
 document.getElementById('bz-fab').href='https://wa.me/8801350323319?text='+encodeURIComponent('আসসালামু আলাইকুম, Business Support নিয়ে সাহায্য দরকার।');
 Business.init();
 document.getElementById('tg').onclick=function(){var d=document.documentElement,on=d.classList.toggle('dark');try{localStorage.setItem('esypos_theme',on?'dark':'light')}catch(e){}document.querySelector('meta[name=theme-color]').content=on?'#0b1220':'#1e40af'};
})();
</script>
